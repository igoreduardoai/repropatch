[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repropatch"
version = "0.1.0"
description = "Evidence-first repair workbench: reproduce, freeze, patch, verify."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.5",
  "httpx==0.28.1", "python-multipart==0.0.29", "python-dotenv==1.2.2"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "playwright==1.57.0"]

[project.scripts]
repropatch-worker = "repropatch.worker:main"

[tool.setuptools]
packages = ["repropatch"]

[tool.setuptools.package-data]
repropatch = ["sandbox_runtime/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
